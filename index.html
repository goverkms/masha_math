<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Arc Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div id="timer-display" class="timer-display">00:00:00</div>
        <div id="star-container" class="star-container">
            <!-- Stars injected by JS -->
        </div>

        <!-- Masha on Left -->
        <div id="sheriff-container" class="character-container sheriff-pos hidden">
            <img src="masha_character.png" alt="Masha from Fairy Patrol" class="character-img">
            <div class="character-bubble">Great Job!</div>
        </div>

        <!-- Alisa on Right -->
        <div id="deputy-container" class="character-container deputy-pos hidden">
            <img src="alisa.png" alt="Alisa" class="character-img">
            <div class="character-bubble">Well Done!</div>
        </div>

        <svg id="arcs-svg" class="arcs-layer" style="display: none;"></svg>
        <div id="equation-container" class="equation-container">
            <!-- Numbers and signs will be injected here -->
        </div>

        <!-- Column Step Container (Middle Section) -->
        <div id="column-step-container" class="column-step-container hidden">
            <!-- Column math will be injected here -->
        </div>

        <!-- Keypad Input Overlay (Bottom Section) -->
        <div id="keypad-overlay" class="keypad-overlay hidden">
            <div class="keypad-grid">
                <button class="keypad-btn" data-val="1">1</button>
                <button class="keypad-btn" data-val="2">2</button>
                <button class="keypad-btn" data-val="3">3</button>
                <button class="keypad-btn" data-val="4">4</button>
                <button class="keypad-btn" data-val="5">5</button>
                <button class="keypad-btn" data-val="6">6</button>
                <button class="keypad-btn" data-val="7">7</button>
                <button class="keypad-btn" data-val="8">8</button>
                <button class="keypad-btn" data-val="9">9</button>
                <button class="keypad-btn del-btn" id="keypad-del">⌫</button>
                <button class="keypad-btn" data-val="0">0</button>
                <button class="keypad-btn submit-btn" id="keypad-submit" disabled>✓</button>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-modal" class="history-modal hidden">
            <div class="history-content">
                <div class="history-header">
                    <div class="header-left">
                        <button id="new-game-btn" class="refresh-btn" title="New Game">↻</button>
                        <button id="open-config-btn" class="config-btn" title="Settings">⚙️</button>
                        <input type="text" id="player-name" placeholder="Enter Name" class="name-input">
                    </div>
                    <h2>Game History</h2>
                    <button id="close-history" class="close-btn">×</button>
                </div>
                <div class="history-body">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th data-sort="date" style="cursor: pointer">Date/Time</th>
                                <th data-sort="steps" style="cursor: pointer">Steps</th>
                                <th data-sort="equation" style="cursor: pointer">Equation</th>
                                <th data-sort="score" style="cursor: pointer">Stars</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Config Editor Modal -->
        <div id="config-modal" class="config-modal hidden">
            <div class="config-content">
                <div class="config-header">
                    <h2>⚙️ Game Settings</h2>
                    <button id="close-config" class="close-btn">×</button>
                </div>
                <div class="config-body">
                    <table class="config-table">
                        <thead>
                            <tr>
                                <th>Min</th>
                                <th>Max</th>
                                <th>Operator</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="config-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                    <div class="config-actions">
                        <button id="add-config-row" class="add-row-btn">+ Add Row</button>
                    </div>
                </div>
                <div class="config-footer">
                    <button id="save-config" class="save-config-btn">Save & Apply</button>
                    <button id="reset-config" class="reset-config-btn">Reset to Default</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
